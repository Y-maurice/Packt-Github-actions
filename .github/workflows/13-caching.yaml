name: 13 - Using Caching

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: whether to execute cache step
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 13-caching/react-app
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Check Node and npm versions
        run: |
          node -v
          npm -v
      - name: Install dependencies
        run: npm ci
      - name: Testing
        run: npm run test
      - name: Building
        run: npm run build
      - name: Deploying to nonprod
        run: echo "Deploying"

    #1. Checkout the code
    #2. Install dependencies
    #3. Linting, formatting, unit testing, building
    #4.Deploy to a nonprod env
